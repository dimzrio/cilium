# cilium-lb-ip-pools.yaml — LB IP pool for Cluster A (single cluster)
#
# This repo currently focuses only on Cluster A.
# Install:
#   kubectl apply -f 01-setup-kind-cluster/config/cilium-lb-ip-pools.yaml
#
# Then set in helm-values.yaml:
#   enableLBIPAM: true
#   defaultLBServiceIPAM: lbipam

---
# Cluster A — single LB IP pool (name: cluster-lb-pool)
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "cluster-lb-pool"
spec:
  blocks:
    - cidr: "10.0.100.0/24"
