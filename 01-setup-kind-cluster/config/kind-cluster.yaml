# kind cluster manifest — 1 control-plane + 2 workers
# disableDefaultCNI: true -> Cilium is the CNI (kind installs no flannel).

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  # No disableDefaultCNI: Flannel is installed by default so nodes become Ready.
  # Cilium will replace Flannel as the CNI when installed.

nodes:
  - role: control-plane
  - role: worker
  - role: worker
