
# kind-config.yaml
# 1 control-plane + 2 workers

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  disableDefaultCNI: true
  kubeProxyMode: "none"

  # Pod subnet
  podSubnet: "10.0.0.0/16"

  # Kubernetes Service subnet
  serviceSubnet: "10.1.0.0/16"

nodes:
  - role: control-plane
  - role: worker
  - role: worker
