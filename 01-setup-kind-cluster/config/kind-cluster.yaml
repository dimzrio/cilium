# kind cluster manifest — 1 control-plane + 2 workers
# disableDefaultCNI: true -> Cilium is the CNI (kind installs no flannel).

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  disableDefaultCNI: true

# Kubernetes version for control-plane and workers.
kubernetesVersion: "1.34.0"

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cni"]
      root = "/home/kind/workload-dir"
      bin-dir = "/usr/local/bin"
      confPath = "/etc/containerd/cni/conf.d"

nodes:
  - role: control-plane
  - role: worker
  - role: worker
