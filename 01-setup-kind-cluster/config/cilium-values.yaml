# cilium helm values for labs
# Install: helm install cilium cilium/cilium --namespace kube-system --version 0.16.0 --values config/cilium-values.yaml

# kube-proxy replacement: Cilium handles L4 LB via eBPF
kubeProxyReplacement: strict

# Cluster pool
clusterPoolIPv4PodCIDR: "10.0.0.0/8"
clusterPoolIPv4MaskSize: 24

# Node CIDR
nodeCIDR: "10.0.0.0/16"
