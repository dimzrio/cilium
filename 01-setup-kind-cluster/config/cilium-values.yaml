# cilium helm values for labs
# Install: helm install cilium cilium/cilium --namespace kube-system --version 0.16.0 --values config/cilium-values.yaml

# kube-proxy replacement: Cilium handles L4 LB via eBPF
kubeProxyReplacement: true

# Cluster pool — sized for up to 3 clusters
# Pool: 10.0.0.0/16 (65,534 pod IPs), /24 per cluster -> 256 possible clusters
clusterPoolIPv4PodCIDR: "10.0.0.0/16"
clusterPoolIPv4MaskSize: 24

# LB IP pool — supports up to 3 clusters
# Separate range from pod pool (10.0.0.0/16) and node CIDR (10.0.0.0/16)
# 10.0.100.0/22 = 4 /24 subnets -> covers 3 clusters + 1 spare
serviceLbPool:
  - 10.0.100.0/22
