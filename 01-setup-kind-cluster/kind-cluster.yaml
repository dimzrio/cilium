# kind cluster manifest — 1 control-plane + 2 workers
# Disable the default CNI (flannel). Cilium will be installed as the CNI.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  disableDefaultCNI: true

# The Kubernetes version to use for the control-plane and workers.
kubernetesVersion: "1.31.0"

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cni"]
      root = "/home/kind/workload-dir"
      bin-dir = "/usr/local/bin"
      confPath = "/etc/containerd/cni/conf.d"

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        apiVersion: kubeadm.k8s.io/v1beta3
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node.kubernetes.io/exclude-from-external-pods="
  - role: worker
  - role: worker
