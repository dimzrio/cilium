# .mise.toml — project-level tool pinning

# Pins the toolchain for the cilium labs project. Read from the project root,
# so mise resolves these versions per-project, not globally. All pinned to
# the current `latest` release at setup time:
#   kind 0.33.0, kubectl 1.37.2, cilium-cli 0.20.3, docker-cli 29.9.3, helm 4.3.2

[tools]
kind       = "0.33.0"
kubectl    = "1.37.2"
cilium-cli = "0.20.3"
docker-cli = "29.9.3"
helm       = "4.3.2"
